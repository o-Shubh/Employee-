name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: worklog
          POSTGRES_PASSWORD: worklog
          POSTGRES_DB: worklog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U worklog" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://worklog:worklog@localhost:5432/worklog_test?schema=public
      DATABASE_URL_TEST: postgresql://worklog:worklog@localhost:5432/worklog_test?schema=public
      AUTH_SECRET: ci-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
